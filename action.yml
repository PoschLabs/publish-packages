name: Publish Linux packages to a package server

description: Upload DEB and RPM packages to a package server

inputs:
  packages-path:
    description: Path containing DEB and RPM packages
    required: false
    default: packages

  server-url:
    description: Base URL of the package server
    required: true

  server-username:
    description: Package server username
    required: true

  server-password:
    description: Package server password
    required: true

  apt-repository:
    description: APT hosted repository name
    required: false
    default: apt

  yum-repository:
    description: Yum hosted repository name
    required: false
    default: yum

runs:
  using: composite

  steps:
    - name: Upload DEB packages
      uses: PoschLabs/publish-packages/upload-deb@v1
      with:
        packages-path: ${{ inputs.packages-path }}
        server-url: ${{ inputs.server-url }}
        server-username: ${{ inputs.server-username }}
        server-password: ${{ inputs.server-password }}
        repository: ${{ inputs.apt-repository }}

    - name: Upload RPM packages
      uses: PoschLabs/publish-packages/upload-rpm@v1
      with:
        packages-path: ${{ inputs.packages-path }}
        server-url: ${{ inputs.server-url }}
        server-username: ${{ inputs.server-username }}
        server-password: ${{ inputs.server-password }}
        repository: ${{ inputs.yum-repository }}
